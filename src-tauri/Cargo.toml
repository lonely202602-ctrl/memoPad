[package]
name = "memopad"
version = "0.5.1"
description = "memoPad - 桌面磨砂玻璃便签待办"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] } # LAN 只读页按本地日期派生打卡状态

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
