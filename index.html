<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>memoPad</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div class="base" data-tauri-drag-region>
      <div class="wallpaper" id="wallpaper" aria-hidden="true"></div>
      <header class="titlebar" data-tauri-drag-region>
        <div class="brand" data-tauri-drag-region>
          <span class="brand-dot"></span><span data-tauri-drag-region>memoPad</span>
        </div>
        <div class="win-actions">
          <button id="btn-theme" class="icon-btn" title="切换主题（跟随系统 / 浅色 / 深色）">◐</button>
          <button id="btn-settings" class="icon-btn" title="设置">⚙</button>
          <button id="btn-hide" class="icon-btn" title="隐藏到托盘">—</button>
        </div>
      </header>

      <nav class="tabs-row">
        <div class="tabs">
          <button class="tab active" data-view="daily">每日</button>
          <button class="tab" data-view="longterm">长期</button>
        </div>
      </nav>

      <div class="date-row" id="date-row" data-tauri-drag-region>
        <button id="date-prev" class="nav-btn" title="前一天">‹</button>
        <button id="date-label" class="date-label" title="点击打开日历">今天</button>
        <button id="date-next" class="nav-btn" title="后一天">›</button>
      </div>

      <div class="calendar hidden" id="calendar"></div>

      <div class="progress-row" id="progress-row">
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
        <span class="progress-text" id="progress-text"></span>
      </div>

      <main class="list" id="list" data-tauri-drag-region></main>

      <div class="carry-row hidden" id="carry-row">
        <button id="carry-btn" class="carry-btn"></button>
      </div>

      <footer class="composer">
        <input id="new-input" type="text" placeholder="添加待办，回车确认…" maxlength="200" autocomplete="off" />
        <button id="add-btn" class="add-btn" title="添加">＋</button>
      </footer>

      <div class="grip" id="grip" title="拖动调整大小"></div>

      <div class="drawer hidden" id="drawer">
        <div class="drawer-head">
          <span>设置</span>
          <button id="drawer-close" class="icon-btn" title="关闭">✕</button>
        </div>
        <div class="drawer-body">
          <div class="setting">
            <label>外观主题</label>
            <div class="seg" id="theme-seg">
              <button data-theme-opt="system">跟随系统</button>
              <button data-theme-opt="light">浅色</button>
              <button data-theme-opt="dark">深色</button>
            </div>
          </div>
          <div class="setting">
            <label>磨砂效果</label>
            <div class="seg" id="blur-seg">
              <button data-blur-opt="acrylic">毛玻璃</button>
              <button data-blur-opt="mica">Mica</button>
              <button data-blur-opt="none">关闭</button>
            </div>
          </div>
          <div class="setting">
            <label>磨砂不透明度 <span class="seg-val" id="glass-alpha-val">50%</span></label>
            <input id="glass-alpha" type="range" min="20" max="90" step="5" value="50" />
          </div>
          <div class="setting row">
            <label>窗口置顶</label>
            <button class="switch" id="top-switch" role="switch" title="便签是否始终保持在其他窗口之上"></button>
          </div>
          <div class="setting row">
            <label>开机自启</label>
            <button class="switch" id="autostart-switch" role="switch"></button>
          </div>
          <div class="setting">
            <label>数据存储位置</label>
            <div class="path-box" id="data-path"></div>
            <div class="path-actions">
              <button id="pick-dir" class="mini-btn">更改…</button>
              <button id="open-dir" class="mini-btn">打开文件夹</button>
            </div>
          </div>
          <div class="about" id="about"></div>
        </div>
      </div>

      <div class="drawer hidden" id="todo-drawer">
        <div class="drawer-head">
          <span>待办详情</span>
          <button id="todo-drawer-close" class="icon-btn" title="关闭">✕</button>
        </div>
        <div class="drawer-body">
          <div class="setting">
            <label>标题</label>
            <input id="detail-title" class="text-input" maxlength="200" autocomplete="off" />
          </div>
          <div class="setting">
            <label>详情</label>
            <textarea id="detail-text" class="text-input area" rows="9" placeholder="补充说明、备注、链接…&#10;自动保存"></textarea>
          </div>
          <div class="meta" id="detail-meta"></div>
          <div class="detail-actions">
            <button id="detail-delete" class="mini-btn danger">删除待办</button>
            <button id="detail-done" class="mini-btn"></button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
